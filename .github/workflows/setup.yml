name: Setup verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure an ephemeral test database credential
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: make dev
      - run: make verify-restart
      - run: make verify-auth
      - run: make verify-connections
      - run: make verify-policy
      - run: make verify-source-intake
      - run: make verify-runtime
      - run: make verify-durability
      - run: make verify-fixtures
      - run: make verify-security
      - name: Retain available security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: .verification/
          include-hidden-files: true
          if-no-files-found: ignore
      - if: failure()
        run: docker compose ps
      - if: always()
        run: docker compose down --volumes
